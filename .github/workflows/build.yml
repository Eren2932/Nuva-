name: Nuva — build & release

# Модель как у ZiziPlayer: код приезжает zip-архивом `nuva-<versionName>.zip` в корень репо.
# Workflow берёт архив с наибольшим versionCode (из version.properties внутри), гоняет
# серверные тесты и тест-векторы, собирает клиентов (когда в архиве есть client/) и
# публикует релиз v<versionName>. GitHub читает ТОЛЬКО корневой .github/workflows —
# копия этого файла внутри zip справочная: при изменении положи её в корень руками.

on:
  push:
    branches: [main, master]
    paths:
      - 'nuva-*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать релиз (выкл — только артефакты)'
        type: boolean
        default: true

permissions:
  contents: write

# Релизы не отменяем на полпути: следующий прогон ждёт в очереди.
concurrency:
  group: nuva-${{ github.ref }}
  cancel-in-progress: false

env:
  PY_VERSION: '3.12'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'

jobs:
  source:
    name: Распаковка архива
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.unpack.outputs.version }}
      code: ${{ steps.unpack.outputs.code }}
      zip: ${{ steps.unpack.outputs.zip }}
      has_client: ${{ steps.unpack.outputs.has_client }}
      prerelease: ${{ steps.unpack.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Выбор и распаковка zip по versionCode
        id: unpack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, re, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath

          candidates = []
          for path in sorted(Path('.').glob('nuva-*.zip')):
              try:
                  with zipfile.ZipFile(path) as z:
                      names = z.namelist()
                      props = [n for n in names if PurePosixPath(n).name == 'version.properties'
                               and len(PurePosixPath(n).parts) <= 2]
                      if len(props) != 1:
                          print(f'skip {path.name}: no single version.properties at root')
                          continue
                      parent = str(PurePosixPath(props[0]).parent)
                      prefix = '' if parent == '.' else parent + '/'
                      if z.getinfo(props[0]).file_size > 4096:
                          raise ValueError('oversized version.properties')
                      text = z.read(props[0]).decode('utf-8')
                      codes = re.findall(r'^\s*versionCode\s*=\s*([0-9]+)\s*$', text, re.M)
                      names_ = re.findall(r'^\s*versionName\s*=\s*([0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?)\s*$', text, re.M)
                      if len(codes) != 1 or len(names_) != 1:
                          raise ValueError('need exactly one versionCode and versionName (X.Y.Z[-tag])')
                      candidates.append((int(codes[0]), path, prefix, names_[0]))
              except (OSError, ValueError, zipfile.BadZipFile) as exc:
                  raise SystemExit(f'Invalid source ZIP {path.name}: {exc}')
          if not candidates:
              raise SystemExit('No nuva-*.zip with version.properties found')
          top = max(c[0] for c in candidates)
          winners = [c[0] for c in candidates if c[0] == top]
          winners = [c for c in candidates if c[0] == top]
          if len(winners) != 1:
              raise SystemExit('Several ZIPs share the highest versionCode: ' + ', '.join(c[1].name for c in winners))
          code, path, prefix, version = winners[0]
          if path.name != f'nuva-{version}.zip':
              print(f'::warning::{path.name} does not match versionName {version} (expected nuva-{version}.zip)')

          with zipfile.ZipFile(path) as z:
              entries = z.infolist()
              if len(entries) > 20000 or sum(e.file_size for e in entries) > 300 * 1024 * 1024:
                  raise SystemExit('Archive exceeds extraction limits')
              if len(set(z.namelist())) != len(entries):
                  raise SystemExit('Duplicate archive entries')
              for e in entries:
                  n = PurePosixPath(e.filename)
                  if (n.is_absolute() or '..' in n.parts or '\\' in e.filename
                          or any(c in e.filename for c in '\r\n') or stat.S_ISLNK(e.external_attr >> 16)):
                      raise SystemExit(f'Unsafe archive entry: {e.filename!r}')
              shutil.rmtree('_src', ignore_errors=True)
              z.extractall('_src')
          root = Path('_src') / prefix.rstrip('/') if prefix else Path('_src')
          if root != Path('_src'):
              tmp = Path('_src_root'); shutil.move(str(root), tmp); shutil.rmtree('_src'); tmp.rename('_src')
          has_client = (Path('_src') / 'client' / 'settings.gradle.kts').is_file()
          if not (Path('_src') / 'server' / 'pyproject.toml').is_file():
              raise SystemExit('server/pyproject.toml missing in archive')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\ncode={code}\nzip={path.name}\n'
                        f'has_client={"true" if has_client else "false"}\n'
                        f'prerelease={"true" if "-" in version else "false"}\n')
          print(f'Selected {path.name}: version {version}, versionCode {code}, client={has_client}')
          print('SHA256', hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Секреты в архиве
        run: |
          set -euo pipefail
          bad=0
          if find _src -type f \( -name '.env' -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name 'local.properties' \) | grep -q .; then
            find _src -type f \( -name '.env' -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name 'local.properties' \)
            echo "::error::В архиве файлы с секретами/локальными путями"; bad=1
          fi
          if grep -rIlE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}' _src; then
            echo "::error::Похоже на приватный ключ/токен в исходниках"; bad=1
          fi
          exit $bad

      - name: Упаковать исходники для следующих job
        run: tar -czf source.tgz _src

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.tgz
          retention-days: 3
          if-no-files-found: error

  server:
    name: Сервер — векторы и тесты
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuva
          POSTGRES_PASSWORD: nuva
          POSTGRES_DB: nuva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nuva -d nuva_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - run: tar -xzf source.tgz

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
          cache-dependency-path: _src/server/pyproject.toml

      - name: Зависимости
        working-directory: _src/server
        run: python -m pip install --quiet -e ".[test]"

      - name: Синтаксис
        working-directory: _src/server
        run: python -m compileall -q app tools tests

      - name: Тест-векторы v1 (эталон == закоммиченный файл, HKDF RFC 5869)
        working-directory: _src/server
        run: python tools/vectors.py --check

      - name: pytest (PostgreSQL)
        working-directory: _src/server
        env:
          DATABASE_URL: postgresql://nuva:nuva@localhost:5432/nuva_test
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$GITHUB_WORKSPACE/server-tests.log"

      - name: Образ собирается
        run: docker build --quiet -t nuva-api:ci _src/server

      - name: Пакет сервера
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/nuva-server-${VERSION}.tar.gz" \
            --exclude='__pycache__' --exclude='.pytest_cache' --exclude='*.egg-info' \
            -C _src server
          cp _src/server/tools/test-vectors.json "dist/nuva-test-vectors-${VERSION}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-server
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-tests-log
          path: server-tests.log
          if-no-files-found: ignore

  android:
    name: Android APK
    needs: source
    if: needs.source.outputs.has_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - run: tar -xzf source.tgz

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ env.JAVA_VERSION }}' }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # Обновление поверх старого APK возможно ТОЛЬКО с тем же ключом и бо́льшим versionCode.
      # Ключ Nuva — свой, не Zizi. Потеря ключа = все пользователи переустанавливают.
      - name: Ключ подписи
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.NUVA_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::NUVA_SIGNING_KEYSTORE_BASE64 не задан: debug-подписанный APK потом не обновится релизным"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nuva.jks"
          echo "path=$RUNNER_TEMP/nuva.jks" >> "$GITHUB_OUTPUT"

      - name: assembleRelease
        working-directory: _src/client
        env:
          NUVA_SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          NUVA_SIGNING_STORE_PASSWORD: ${{ secrets.NUVA_SIGNING_STORE_PASSWORD }}
          NUVA_SIGNING_KEY_ALIAS: ${{ secrets.NUVA_SIGNING_KEY_ALIAS }}
          NUVA_SIGNING_KEY_PASSWORD: ${{ secrets.NUVA_SIGNING_KEY_PASSWORD }}
          NUVA_SERVER_HOST: ${{ vars.NUVA_SERVER_HOST }}
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app-android:assembleRelease :core:allTests --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Проверка подписи
        run: |
          set -euo pipefail
          apk=$(find _src/client/app-android/build/outputs/apk/release -name '*.apk' | head -1)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$signer" verify --print-certs "$apk" | tee "$RUNNER_TEMP/sig.txt" | grep -E 'DN|SHA-256' || true
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/sig.txt"; then
            echo "::error::APK подписан debug-ключом"; exit 1
          fi
          mkdir -p dist && cp "$apk" "dist/Nuva-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore

  desktop:
    name: Desktop ${{ matrix.os }}
    needs: source
    if: needs.source.outputs.has_client == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            format: msi
          - os: ubuntu-latest
            format: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - run: tar -xzf source.tgz

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ env.JAVA_VERSION }}' }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: package${{ matrix.format }}
        working-directory: _src/client
        env:
          NUVA_SERVER_HOST: ${{ vars.NUVA_SERVER_HOST }}
        run: gradle --no-daemon --max-workers=2 :app-desktop:packageDistributionForCurrentOS --stacktrace

      - name: Переименовать
        run: |
          set -euo pipefail
          f=$(find _src/client/app-desktop/build/compose/binaries -name "*.${{ matrix.format }}" | head -1)
          [ -n "$f" ] || { echo "::error::нет .${{ matrix.format }}"; exit 1; }
          mkdir -p dist && cp "$f" "dist/Nuva-${VERSION}.${{ matrix.format }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Релиз v${{ needs.source.outputs.version }}
    needs: [source, server, android, desktop]
    # android/desktop = skipped, пока в архиве нет client/. Падение любого = релиза нет.
    if: >-
      always() &&
      needs.source.result == 'success' &&
      needs.server.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.source.outputs.version }}
      CODE: ${{ needs.source.outputs.code }}
      TAG: v${{ needs.source.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with: { name: source }
      - run: tar -xzf source.tgz

      # versionCode только растёт: иначе Android откажется ставить APK поверх.
      - name: Монотонность версии
        run: |
          set -euo pipefail
          prev_tag=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -n "$prev_tag" ] && gh release download "$prev_tag" --pattern version.json --output prev.json 2>/dev/null; then
            prev_code=$(jq -r .versionCode prev.json); prev_name=$(jq -r .versionName prev.json)
            echo "Предыдущий релиз: $prev_tag ($prev_name, code $prev_code)"
            if [ "$CODE" -lt "$prev_code" ]; then
              echo "::error::versionCode $CODE < $prev_code ($prev_tag). Подними versionCode в version.properties."; exit 1
            fi
            if [ "$CODE" -eq "$prev_code" ] && [ "$VERSION" != "$prev_name" ]; then
              echo "::error::versionCode $CODE уже занят версией $prev_name"; exit 1
            fi
            if [ "$CODE" -eq "$prev_code" ]; then
              echo "::warning::Та же версия $VERSION: ассеты релиза $TAG будут перезалиты"
            fi
          else
            echo "Предыдущих релизов с version.json нет"
          fi

      - name: version.json и заметки
        run: |
          set -euo pipefail
          jq -n --arg n "$VERSION" --argjson c "$CODE" --arg sha "$GITHUB_SHA" \
            '{versionName:$n, versionCode:$c, commit:$sha, protocol:"nuva.v1", envelope:1}' > dist/version.json
          if [ -f _src/RELEASE_NOTES.md ]; then cp _src/RELEASE_NOTES.md notes.md
          else printf 'Nuva %s (versionCode %s)\n' "$VERSION" "$CODE" > notes.md; fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Nuva ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: ${{ needs.source.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.source.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          
